<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Data Entry</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f5f7;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .container {
        width: 380px;
        background: white;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    h2 {
        margin-top: 0;
        margin-bottom: 30px;
        text-align: center;
        color: #333;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #444;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 22px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
    }

    input:focus {
        outline: none;
        border-color: #0078d4;
    }

    button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 6px;
        background: #0078d4;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #005ea6;
    }

    button:disabled {
        background: #999;
        cursor: not-allowed;
    }

    #message {
        text-align: center;
        margin-top: 20px;
        min-height: 22px;
        font-weight: bold;
    }

    .success {
        color: #16833b;
    }

    .error {
        color: #d13438;
    }

    .info {
        color: #555;
    }

</style>

</head>

<body>

<div class="container">

    <h2>Data Entry</h2>

    <label for="name">Name</label>

    <input
        type="text"
        id="name"
        placeholder="Enter name"
        autocomplete="off"
    >

    <label for="number">Number</label>

    <input
        type="text"
        id="number"
        placeholder="Enter number"
        autocomplete="off"
    >

    <button
        id="submitButton"
        onclick="submitData()">
        Submit
    </button>

    <div id="message"></div>

</div>


<script>

/* ==================================================
   CHANGE THESE SETTINGS
   ================================================== */

const OWNER = "Manchi95";

const REPO = "Psychiatric-Care-Facilities";

const FILE_PATH = "abc.csv";

const BRANCH = "main";


/* ==================================================
   TOKEN

   Token is NOT saved inside this HTML file.
   You will enter it once after opening the page.
   ================================================== */

let githubToken = "";


/* ==================================================
   GET TOKEN
   ================================================== */

function getToken() {

    if (!githubToken) {

        githubToken = prompt(
            "Enter your GitHub access token:"
        );

    }

    return githubToken;
}


/* ==================================================
   CSV VALUE PROTECTION
   ================================================== */

function csvValue(value) {

    value = String(value);

    value = value.replace(/"/g, '""');

    return '"' + value + '"';
}


/* ==================================================
   UTF-8 -> BASE64
   ================================================== */

function utf8ToBase64(text) {

    const bytes =
        new TextEncoder().encode(text);

    let binary = "";

    for (let i = 0; i < bytes.length; i++) {

        binary +=
            String.fromCharCode(bytes[i]);

    }

    return btoa(binary);
}


/* ==================================================
   BASE64 -> UTF-8
   ================================================== */

function base64ToUtf8(base64) {

    const binary = atob(
        base64.replace(/\n/g, "")
    );

    const bytes =
        new Uint8Array(binary.length);

    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        bytes[i] =
            binary.charCodeAt(i);

    }

    return new TextDecoder().decode(bytes);
}


/* ==================================================
   SUBMIT
   ================================================== */

async function submitData() {

    const name =
        document
        .getElementById("name")
        .value
        .trim();

    const number =
        document
        .getElementById("number")
        .value
        .trim();

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("submitButton");


    /* ----------------------------------------------
       Validate input
       ---------------------------------------------- */

    if (name === "") {

        message.className = "error";

        message.textContent =
            "Please enter a Name.";

        document
        .getElementById("name")
        .focus();

        return;
    }


    if (number === "") {

        message.className = "error";

        message.textContent =
            "Please enter a Number.";

        document
        .getElementById("number")
        .focus();

        return;
    }


    /* ----------------------------------------------
       Get GitHub token
       ---------------------------------------------- */

    const token = getToken();

    if (!token) {

        message.className = "error";

        message.textContent =
            "GitHub token is required.";

        return;
    }


    button.disabled = true;

    button.textContent = "Saving...";

    message.className = "info";

    message.textContent =
        "Saving data...";


    try {


        /* ==========================================
           STEP 1
           Get current abc.csv
           ========================================== */

        const fileUrl =
            "https://api.github.com/repos/" +
            OWNER + "/" +
            REPO +
            "/contents/" +
            FILE_PATH +
            "?ref=" +
            BRANCH;


        const getResponse =
            await fetch(fileUrl, {

                method: "GET",

                headers: {

                    "Authorization":
                        "Bearer " + token,

                    "Accept":
                        "application/vnd.github+json",

                    "X-GitHub-Api-Version":
                        "2022-11-28"

                }

            });


        if (!getResponse.ok) {

            if (
                getResponse.status === 401 ||
                getResponse.status === 403
            ) {

                githubToken = "";

                throw new Error(
                    "GitHub login/token failed."
                );

            }

            if (getResponse.status === 404) {

                throw new Error(
                    "abc.csv or repository was not found."
                );

            }

            throw new Error(
                "Unable to read abc.csv."
            );

        }


        const fileInfo =
            await getResponse.json();


        /* ==========================================
           STEP 2
           Decode existing CSV
           ========================================== */

        let existingCSV =
            base64ToUtf8(
                fileInfo.content
            );


        /* ==========================================
           STEP 3
           Add newline if required
           ========================================== */

        if (
            existingCSV.length > 0 &&
            !existingCSV.endsWith("\n")
        ) {

            existingCSV += "\r\n";

        }


        /* ==========================================
           STEP 4
           Create new row
           ========================================== */

        const newRow =

            csvValue(name) +
            "," +
            csvValue(number) +
            "\r\n";


        /* ==========================================
           STEP 5
           Combine data
           ========================================== */

        const updatedCSV =
            existingCSV + newRow;


        /* ==========================================
           STEP 6
           Convert updated CSV to Base64
           ========================================== */

        const encodedContent =
            utf8ToBase64(updatedCSV);


        /* ==========================================
           STEP 7
           Update abc.csv on GitHub
           ========================================== */

        const updateResponse =
            await fetch(fileUrl, {

                method: "PUT",

                headers: {

                    "Authorization":
                        "Bearer " + token,

                    "Accept":
                        "application/vnd.github+json",

                    "Content-Type":
                        "application/json",

                    "X-GitHub-Api-Version":
                        "2022-11-28"

                },

                body: JSON.stringify({

                    message:
                        "Add data: " + name,

                    content:
                        encodedContent,

                    sha:
                        fileInfo.sha,

                    branch:
                        BRANCH

                })

            });


        if (!updateResponse.ok) {

            const errorInfo =
                await updateResponse.json();

            console.error(errorInfo);

            if (
                updateResponse.status === 401 ||
                updateResponse.status === 403
            ) {

                githubToken = "";

                throw new Error(
                    "Token does not have permission to update abc.csv."
                );

            }

            if (updateResponse.status === 409) {

                throw new Error(
                    "File changed during submission. Please press Submit again."
                );

            }

            throw new Error(
                "GitHub could not update abc.csv."
            );

        }


        /* ==========================================
           SUCCESS
           ========================================== */

        message.className =
            "success";

        message.textContent =
            "✓ Data saved successfully";


        /* Clear fields */

        document
        .getElementById("name")
        .value = "";

        document
        .getElementById("number")
        .value = "";


        /* Cursor back to Name */

        document
        .getElementById("name")
        .focus();


        /* Remove message after 3 seconds */

        setTimeout(function() {

            message.textContent = "";

        }, 3000);


    }

    catch(error) {

        console.error(error);

        message.className =
            "error";

        message.textContent =
            error.message;

    }

    finally {

        button.disabled = false;

        button.textContent =
            "Submit";

    }

}


/* ==================================================
   ENTER = SUBMIT
   ================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            submitData();

        }

    }
);


/* Focus Name when page opens */

window.onload = function() {

    document
    .getElementById("name")
    .focus();

};

</script>


</body>

</html>
